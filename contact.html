*{margin:0;padding:0;box-sizing:border-box;}

body{
    font-family:Arial,"Noto Sans Thai",sans-serif;
    color:white;
    min-height:100vh;
    overflow:hidden;
}

.space{
    position:fixed;
    inset:0;
    z-index:-20;
    background:
        linear-gradient(rgba(0,0,0,.15),rgba(0,0,0,.15)),
        url("space.jpg") center/cover no-repeat;
}

.space::after{
    content:"";
    position:absolute;
    inset:0;
    background-image:
        radial-gradient(white 1px,transparent 1.5px),
        radial-gradient(#8eeaff 1px,transparent 1.5px);
    background-size:100px 100px,160px 160px;
    opacity:.35;
}

nav{
    position:relative;
    z-index:100;
    min-height:75px;

    display:flex;
    justify-content:center;
    align-items:center;
    gap:20px;

    background:rgba(0,5,20,.65);
    backdrop-filter:blur(12px);

    border-bottom:1px solid rgba(100,220,255,.3);
}

nav a{
    color:white;
    text-decoration:none;
    padding:10px 18px;
    border-radius:25px;
}

nav a:hover{
    background:rgba(0,200,255,.2);
    color:#7eeaff;
}

.main{
    min-height:calc(100vh - 75px);

    display:flex;
    justify-content:center;
    align-items:center;

    padding:25px;
}

.card{
    width:600px;
    padding:45px;

    text-align:center;

    background:rgba(0,20,55,.84);
    backdrop-filter:blur(14px);

    border:1px solid rgba(100,220,255,.45);
    border-radius:30px;

    box-shadow:0 0 35px rgba(0,150,255,.3);
}

.card h1{
    color:#69e8ff;
    font-size:40px;
    text-shadow:0 0 15px #00d9ff;
    margin-bottom:30px;
}

.contact{
    display:flex;
    flex-direction:column;
    gap:18px;
}

.contact-box{
    padding:18px;
    border-radius:18px;
    background:rgba(0,80,140,.3);
    border:1px solid rgba(100,220,255,.25);
    font-size:18px;
}

.contact-box strong{
    color:#69e8ff;
    display:block;
    margin-bottom:5px;
}

.home{
    display:inline-block;
    margin-top:28px;
    padding:13px 30px;

    background:linear-gradient(90deg,#0077ff,#00d9ff);

    color:white;
    text-decoration:none;

    border-radius:30px;
    font-weight:bold;

    box-shadow:0 0 20px rgba(0,210,255,.6);
}
</style>
