<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ติดต่อ | Portfolio</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial,"Noto Sans Thai",sans-serif;
    color:white;
    min-height:100vh;
    overflow:hidden;
}

.space{
    position:fixed;
    inset:0;
    z-index:-20;

    background:
        linear-gradient(rgba(0,0,0,.2),rgba(0,0,0,.25)),
        url("space.jpg") center/cover no-repeat;
}

.space::after{
    content:"";
    position:absolute;
    inset:0;

    background-image:
        radial-gradient(white 1px,transparent 1.5px),
        radial-gradient(#8eeaff 1px,transparent 1.5px);

    background-size:100px 100px,160px 160px;
    opacity:.4;
}

/* ===== เมนู ===== */

nav{
    position:relative;
    z-index:100;

    min-height:75px;

    display:flex;
    justify-content:center;
    align-items:center;
    gap:12px;

    background:rgba(0,5,20,.55);
    backdrop-filter:blur(12px);

    border-bottom:1px solid rgba(100,220,255,.25);
}

nav a{
    color:white;
    text-decoration:none;

    padding:10px 20px;

    border-radius:25px;

    background:rgba(0,60,110,.35);
    border:1px solid rgba(100,220,255,.35);

    transition:.25s;
}

nav a:hover{
    transform:translateY(-3px) scale(1.04);

    background:rgba(0,150,220,.35);

    color:#8eeaff;

    box-shadow:
        0 0 15px rgba(0,210,255,.7);
}

nav a:active{
    transform:scale(.90);

    box-shadow:
        0 0 30px #00d9ff,
        inset 0 0 15px rgba(255,255,255,.3);
}

/* ===== ระบบสุริยะ ===== */

.solar{
    position:fixed;

    width:720px;
    height:720px;

    right:-170px;
    top:55%;

    transform:
        translateY(-50%)
        rotateX(20deg)
        rotateY(-15deg);

    perspective:1200px;

    z-index:0;
    pointer-events:none;
}

.sun{
    position:absolute;

    width:105px;
    height:105px;

    left:50%;
    top:50%;

    transform:translate(-50%,-50%);

    border-radius:50%;

    background:radial-gradient(
        circle,
        #fff 4%,
        #fff7a0 22%,
        #ffd21c 48%,
        #ff8500 75%,
        #ff3d00 100%
    );

    box-shadow:
        0 0 30px #fff,
        0 0 70px #ffd21c,
        0 0 130px #ff8500;

    animation:sunGlow 3s infinite alternate;
}

@keyframes sunGlow{
    from{filter:brightness(1);}
    to{filter:brightness(1.25);}
}

.orbit{
    position:absolute;

    left:50%;
    top:50%;

    border:1px solid rgba(100,220,255,.38);
    border-radius:50%;

    transform:
        translate(-50%,-50%)
        rotateX(65deg);
}

.o1{width:160px;height:160px;}
.o2{width:230px;height:230px;}
.o3{width:310px;height:310px;}
.o4{width:400px;height:400px;}
.o5{width:510px;height:510px;}
.o6{width:630px;height:630px;}

.planet{
    position:absolute;
    left:50%;
    top:50%;
    border-radius:50%;
}

.p1{
    width:13px;height:13px;
    background:#aaa;
    animation:o1 5s linear infinite;
}

.p2{
    width:19px;height:19px;
    background:#d6a96c;
    animation:o2 8s linear infinite;
}

.p3{
    width:25px;height:25px;

    background:
        radial-gradient(circle at 30% 30%,
        #8df3ff,#087cff 55%,#063c9e);

    box-shadow:0 0 18px #00cfff;

    animation:o3 11s linear infinite;
}

.p4{
    width:19px;height:19px;
    background:#d9533d;
    animation:o4 15s linear infinite;
}

.p5{
    width:43px;height:43px;

    background:
        linear-gradient(
            #d8b58c,
            #8d684d,
            #e1c79e,
            #9b7455
        );

    animation:o5 20s linear infinite;
}

.p6{
    width:35px;height:35px;
    background:#d9bd7c;
    animation:o6 26s linear infinite;
}

.p6::after{
    content:"";

    position:absolute;

    width:62px;
    height:16px;

    left:50%;
    top:50%;

    transform:
        translate(-50%,-50%)
        rotate(-15deg);

    border:3px solid rgba(230,210,160,.85);
    border-radius:50%;
}

@keyframes o1{
    from{transform:rotate(0deg) translateX(80px);}
    to{transform:rotate(360deg) translateX(80px);}
}

@keyframes o2{
    from{transform:rotate(60deg) translateX(115px);}
    to{transform:rotate(420deg) translateX(115px);}
}

@keyframes o3{
    from{transform:rotate(120deg) translateX(155px);}
    to{transform:rotate(480deg) translateX(155px);}
}

@keyframes o4{
    from{transform:rotate(180deg) translateX(200px);}
    to{transform:rotate(540deg) translateX(200px);}
}

@keyframes o5{
    from{transform:rotate(230deg) translateX(255px);}
    to{transform:rotate(590deg) translateX(255px);}
}

@keyframes o6{
    from{transform:rotate(300deg) translateX(315px);}
    to{transform:rotate(660deg) translateX(315px);}
}

/* ===== เนื้อหา ===== */

.main{
    position:relative;
    z-index:10;

    min-height:calc(100vh - 75px);

    display:flex;
    justify-content:center;
    align-items:center;

    padding:25px;
}

.card{
    width:600px;

    padding:45px;

    text-align:center;

    background:rgba(0,15,45,.42);
    backdrop-filter:blur(7px);

    border:1px solid rgba(100,220,255,.35);

    border-radius:30px;

    box-shadow:
        0 0 25px rgba(0,150,255,.18);
}

.card h1{
    font-size:40px;

    color:#69e8ff;

    text-shadow:
        0 0 10px #00d9ff,
        0 0 25px #008cff;

    margin-bottom:30px;
}

.contact{
    display:flex;
    flex-direction:column;
    gap:18px;
}

.contact-box{
    padding:18px;

    border-radius:18px;

    background:rgba(0,70,120,.25);

    border:1px solid rgba(100,220,255,.3);

    font-size:18px;

    transition:.25s;
}

.contact-box:hover{
    transform:translateY(-4px);

    box-shadow:
        0 0 20px rgba(0,210,255,.4);
}

.contact-box strong{
    display:block;

    color:#69e8ff;

    margin-bottom:5px;
}

.home{
    display:inline-block;

    margin-top:28px;

    padding:13px 30px;

    background:linear-gradient(
        90deg,
        #0077ff,
        #00d9ff
    );

    color:white;

    text-decoration:none;

    border-radius:30px;

    font-weight:bold;

    box-shadow:
        0 0 20px rgba(0,210,255,.55);

    transition:.25s;
}

.home:hover{
    transform:translateY(-4px) scale(1.04);

    box-shadow:
        0 0 30px #00d9ff,
        0 0 50px rgba(0,150,255,.5);
}

.home:active{
    transform:scale(.90);

    box-shadow:
        0 0 45px #fff,
        0 0 70px #00d9ff;
}

@media(max-width:800px){

    body{
        overflow:auto;
    }

    nav{
        flex-wrap:wrap;
    }

    nav a{
        font-size:13px;
        padding:8px 12px;
    }

    .solar{
        right:-300px;
        opacity:.5;
    }

    .card{
        width:100%;
        padding:30px 20px;
    }

    .card h1{
        font-size:30px;
    }
}
</style>
