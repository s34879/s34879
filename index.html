<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Portfolio | ภัคจิรา นงนุช</title>

<style>

/* =========================
   พื้นฐาน
========================= */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,body{
    width:100%;
    min-height:100%;
}

body{
    font-family:Arial, "Noto Sans Thai", sans-serif;
    color:white;
    background:#000713;
    overflow-x:hidden;
}


/* =========================
   พื้นหลังอวกาศ
========================= */

.space{
    position:fixed;
    inset:0;

    width:100%;
    height:100%;

    z-index:0;

    background:
        url("space.jpg")
        center center
        / cover
        no-repeat;

    filter:brightness(.45) contrast(1.15);
}


/* ดาวเพิ่ม */

.space::after{
    content:"";

    position:absolute;
    inset:0;

    background-image:
        radial-gradient(
            white 1.3px,
            transparent 1.3px
        ),
        radial-gradient(
            #9eeaff 1px,
            transparent 1px
        );

    background-size:
        90px 90px,
        145px 145px;

    opacity:.65;
}


/* =========================
   NAVBAR
========================= */

nav{
    position:relative;

    z-index:20;

    min-height:75px;

    display:flex;

    justify-content:center;
    align-items:center;

    gap:25px;

    padding:10px;

    background:rgba(0,5,20,.78);

    backdrop-filter:blur(10px);

    border-bottom:
        1px solid
        rgba(80,210,255,.3);
}

nav a{
    color:white;

    text-decoration:none;

    font-size:16px;

    padding:10px 18px;

    border-radius:25px;

    transition:.3s;
}

nav a:hover{
    color:#75eaff;

    background:
        rgba(0,180,255,.18);

    box-shadow:
        0 0 18px
        rgba(0,210,255,.45);
}


/* =========================
   ระบบสุริยะ
========================= */

.solar{
    position:fixed;

    width:700px;
    height:700px;

    right:-100px;
    top:55%;

    transform:translateY(-50%);

    z-index:2;

    pointer-events:none;
}


/* =========================
   ดวงอาทิตย์
========================= */

.sun{
    position:absolute;

    width:105px;
    height:105px;

    left:50%;
    top:50%;

    transform:translate(-50%,-50%);

    border-radius:50%;

    background:
        radial-gradient(
            circle,
            #ffffff 4%,
            #fff8a0 22%,
            #ffd21c 48%,
            #ff8c00 75%,
            #ff4500 100%
        );

    box-shadow:
        0 0 25px #ffffff,
        0 0 60px #ffd21c,
        0 0 110px #ff8c00,
        0 0 170px rgba(255,100,0,.5);

    animation:sunGlow 3s ease-in-out infinite alternate;
}

@keyframes sunGlow{

    from{
        transform:
            translate(-50%,-50%)
            scale(1);
    }

    to{
        transform:
            translate(-50%,-50%)
            scale(1.08);
    }
}


/* =========================
   วงโคจร
========================= */

.orbit{
    position:absolute;

    left:50%;
    top:50%;

    border:
        1px solid
        rgba(90,210,255,.32);

    border-radius:50%;

    transform:
        translate(-50%,-50%)
        rotateX(65deg);
}

.o1{
    width:160px;
    height:160px;
}

.o2{
    width:240px;
    height:240px;
}

.o3{
    width:320px;
    height:320px;
}

.o4{
    width:410px;
    height:410px;
}

.o5{
    width:520px;
    height:520px;
}

.o6{
    width:630px;
    height:630px;
}


/* =========================
   ดาวเคราะห์
========================= */

.planet{
    position:absolute;

    left:50%;
    top:50%;

    border-radius:50%;
}


/* ดาวพุธ */

.p1{
    width:13px;
    height:13px;

    background:#aaa;

    animation:
        orbit1
        5s
        linear
        infinite;
}


/* ดาวศุกร์ */

.p2{
    width:19px;
    height:19px;

    background:#d6a96c;

    box-shadow:
        0 0 10px #d6a96c;

    animation:
        orbit2
        8s
        linear
        infinite;
}


/* โลก */

.p3{
    width:24px;
    height:24px;

    background:
        radial-gradient(
            circle at 30% 30%,
            #8df3ff,
            #087cff 55%,
            #063c9e
        );

    box-shadow:
        0 0 15px #00cfff;

    animation:
        orbit3
        11s
        linear
        infinite;
}


/* ดาวอังคาร */

.p4{
    width:19px;
    height:19px;

    background:#d9533d;

    box-shadow:
        0 0 10px #e65b3c;

    animation:
        orbit4
        15s
        linear
        infinite;
}


/* ดาวพฤหัส */

.p5{
    width:42px;
    height:42px;

    background:
        linear-gradient(
            #d8b58c,
            #8d684d,
            #d8c09b
        );

    animation:
        orbit5
        20s
        linear
        infinite;
}


/* ดาวเสาร์ */

.p6{
    width:35px;
    height:35px;

    background:#d9bd7c;

    animation:
        orbit6
        26s
        linear
        infinite;
}


/* วงแหวนดาวเสาร์ */

.p6::after{
    content:"";

    position:absolute;

    width:60px;
    height:15px;

    left:50%;
    top:50%;

    transform:
        translate(-50%,-50%)
        rotate(-15deg);

    border:
        3px solid
        rgba(230,210,160,.8);

    border-radius:50%;
}


/* =========================
   การหมุน
========================= */

@keyframes orbit1{

    from{
        transform:
            rotate(0deg)
            translateX(80px);
    }

    to{
        transform:
            rotate(360deg)
            translateX(80px);
    }
}

@keyframes orbit2{

    from{
        transform:
            rotate(60deg)
            translateX(120px);
    }

    to{
        transform:
            rotate(420deg)
            translateX(120px);
    }
}

@keyframes orbit3{

    from{
        transform:
            rotate(120deg)
            translateX(160px);
    }

    to{
        transform:
            rotate(480deg)
            translateX(160px);
    }
}

@keyframes orbit4{

    from{
        transform:
            rotate(180deg)
            translateX(205px);
    }

    to{
        transform:
            rotate(540deg)
            translateX(205px);
    }
}

@keyframes orbit5{

    from{
        transform:
            rotate(230deg)
            translateX(260px);
    }

    to{
        transform:
            rotate(590deg)
            translateX(260px);
    }
}

@keyframes orbit6{

    from{
        transform:
            rotate(300deg)
            translateX(315px);
    }

    to{
        transform:
            rotate(660deg)
            translateX(315px);
    }
}


/* =========================
   เนื้อหาหน้าแรก
========================= */

.main{
    position:relative;

    z-index:10;

    min-height:
        calc(100vh - 75px);

    display:flex;

    justify-content:center;
    align-items:center;

    padding:
        35px
        20px
        55px;
}

.content{
    width:700px;

    text-align:center;
}


/* =========================
   WELCOME
========================= */

.welcome{
    font-size:40px;

    font-weight:900;

    color:#6eeaff;

    text-shadow:
        0 0 10px #00d9ff,
        0 0 25px rgba(0,200,255,.7);

    margin-bottom:22px;
}


/* =========================
   รูปโปรไฟล์
========================= */

.profile{
    width:145px;
    height:145px;

    object-fit:cover;

    border-radius:50%;

    border:
        4px solid
        #7cecff;

    box-shadow:
        0 0 20px
        rgba(0,210,255,.8),

        0 0 45px
        rgba(0,150,255,.45);

    margin-bottom:15px;
}


/* =========================
   ชื่อ
========================= */

.name{
    margin-bottom:20px;
}

.name h1{
    font-size:43px;

    color:white;

    text-shadow:
        0 0 10px #00d9ff,
        0 0 25px rgba(0,200,255,.7);

    margin-bottom:8px;
}

.name p{
    font-size:19px;

    color:#d9f8ff;
}


/* =========================
   การ์ด
========================= */

.intro-card{
    padding:
        28px
        35px;

    background:
        rgba(0,20,55,.88);

    backdrop-filter:blur(12px);

    border:
        1px solid
        rgba(100,220,255,.5);

    border-radius:30px;

    box-shadow:
        0 0 30px
        rgba(0,130,255,.3);
}


/* แนะนำตัว */

.intro{
    font-size:19px;

    line-height:1.8;

    color:#effcff;

    margin-bottom:18px;
}


/* เป้าหมาย */

.future{
    font-size:17px;

    line-height:1.8;

    color:#d9f8ff;

    margin-bottom:23px;
}

.future strong{
    color:#69eaff;
}


/* =========================
   ปุ่ม
========================= */

.more{
    display:inline-block;

    padding:
        14px
        35px;

    border-radius:35px;

    background:
        linear-gradient(
            90deg,
            #0077ff,
            #00d9ff
        );

    color:white;

    text-decoration:none;

    font-size:19px;

    font-weight:bold;

    box-shadow:
        0 0 20px
        rgba(0,210,255,.7);

    transition:.3s;
}

.more:hover{
    transform:scale(1.07);

    box-shadow:
        0 0 35px
        #00d9ff;
}


/* =========================
   มือถือ
========================= */

@media(max-width:800px){

    body{
        overflow:auto;
    }

    nav{
        gap:3px;

        flex-wrap:wrap;
    }

    nav a{
        font-size:13px;

        padding:
            8px
            10px;
    }

    .main{
        padding:
            30px
            15px
            50px;
    }

    .welcome{
        font-size:29px;
    }

    .profile{
        width:125px;
        height:125px;
    }

    .name h1{
        font-size:32px;
    }

    .name p{
        font-size:17px;
    }

    .intro-card{
        padding:
            25px
            20px;
    }

    .intro{
        font-size:17px;
    }

    .future{
        font-size:15px;
    }

    .solar{
        width:520px;
        height:520px;

        right:-270px;
        top:55%;

        opacity:.5;
    }

}

</style>
</head>


<body>


<!-- =========================
     พื้นหลัง
========================= -->

<div class="space"></div>

     ระบบสุริยะ
