<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>นางสาวภัคจิรา นงนุช | My Portfolio</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,"Noto Sans Thai",sans-serif;
    color:white;
    min-height:100vh;
    overflow:hidden;
    background:#020817;
}

/* ================= BACKGROUND ================= */

.space{
    position:fixed;
    inset:0;
    z-index:-20;

    background:
    linear-gradient(
        rgba(0,5,25,.12),
        rgba(0,10,35,.25)
    ),
    url("space.jpg") center/cover no-repeat;
}

.space:after{
    content:"";
    position:absolute;
    inset:0;

    background-image:
        radial-gradient(#ffffff 1px,transparent 1px),
        radial-gradient(#8eeaff 1px,transparent 1px);

    background-size:
        90px 90px,
        145px 145px;

    opacity:.55;
}


/* ================= SOLAR SYSTEM ================= */

.solar{
    position:fixed;

    width:720px;
    height:720px;

    right:-40px;
    top:50%;

    transform:
        translateY(-50%)
        rotateX(15deg)
        rotateY(-8deg);

    perspective:1200px;

    z-index:-3;

    pointer-events:none;
}


/* SUN */

.sun{
    position:absolute;

    width:105px;
    height:105px;

    left:50%;
    top:50%;

    transform:translate(-50%,-50%);

    border-radius:50%;

    background:
        radial-gradient(
            circle,
            #ffffff 3%,
            #fff8a5 22%,
            #ffd21c 50%,
            #ff8500 75%,
            #ff4d00 100%
        );

    box-shadow:
        0 0 30px #ffffff,
        0 0 70px #ffd21c,
        0 0 130px #ff8500,
        0 0 190px rgba(255,100,0,.5);

    animation:sunPulse 3s ease-in-out infinite alternate;
}

@keyframes sunPulse{

    from{
        transform:translate(-50%,-50%) scale(1);
    }

    to{
        transform:translate(-50%,-50%) scale(1.08);
    }

}


/* ORBITS */

.orbit{
    position:absolute;

    left:50%;
    top:50%;

    border:
        1px solid
        rgba(130,225,255,.38);

    border-radius:50%;

    transform:
        translate(-50%,-50%)
        rotateX(62deg);

    box-shadow:
        0 0 8px rgba(0,200,255,.08);
}

.o1{
    width:170px;
    height:170px;
}

.o2{
    width:245px;
    height:245px;
}

.o3{
    width:330px;
    height:330px;
}

.o4{
    width:425px;
    height:425px;
}

.o5{
    width:525px;
    height:525px;
}

.o6{
    width:625px;
    height:625px;
}


/* PLANETS */

.planet{
    position:absolute;

    left:50%;
    top:50%;

    border-radius:50%;
}


/* Mercury */

.p1{
    width:13px;
    height:13px;

    background:
        radial-gradient(
            circle at 30% 30%,
            #eeeeee,
            #777777
        );

    box-shadow:
        0 0 12px #dddddd;

    animation:
        orbit1
        5s
        linear
        infinite;
}


/* Venus */

.p2{
    width:20px;
    height:20px;

    background:
        radial-gradient(
            circle at 30% 30%,
            #ffe1a0,
            #c77b32
        );

    box-shadow:
        0 0 15px #ffc56d;

    animation:
        orbit2
        8s
        linear
        infinite;
}


/* Earth */

.p3{
    width:25px;
    height:25px;

    background:
        radial-gradient(
            circle at 30% 30%,
            #65d8ff,
            #1671c5 55%,
            #073d85
        );

    box-shadow:
        0 0 18px #26cfff;

    animation:
        orbit3
        11s
        linear
        infinite;
}


/* Mars */

.p4{
    width:19px;
    height:19px;

    background:
        radial-gradient(
            circle at 30% 30%,
            #ff9075,
            #a93226
        );

    box-shadow:
        0 0 14px #ff6655;

    animation:
        orbit4
        15s
        linear
        infinite;
}


/* Jupiter */

.p5{
    width:48px;
    height:48px;

    background:
        linear-gradient(
            180deg,
            #ead0a4,
            #a9784f,
            #ead5af,
            #95613f
        );

    box-shadow:
        0 0 18px #e9bd87;

    animation:
        orbit5
        22s
        linear
        infinite;
}


/* Saturn */

.p6{
    width:39px;
    height:39px;

    background:
        radial-gradient(
            circle at 30% 30%,
            #fff1bb,
            #bca06a
        );

    box-shadow:
        0 0 18px #ffe9a3;

    animation:
        orbit6
        30s
        linear
        infinite;
}


/* SATURN RING */

.p6:after{
    content:"";

    position:absolute;

    width:65px;
    height:19px;

    left:50%;
    top:50%;

    transform:
        translate(-50%,-50%)
        rotate(-18deg);

    border:
        3px solid
        rgba(245,220,160,.8);

    border-radius:50%;

    box-shadow:
        0 0 8px rgba(255,230,170,.5);
}


/* ORBIT ANIMATION */

@keyframes orbit1{

    from{
        transform:
            rotate(0deg)
            translateX(85px)
            rotate(0deg);
    }

    to{
        transform:
            rotate(360deg)
            translateX(85px)
            rotate(-360deg);
    }

}

@keyframes orbit2{

    from{
        transform:
            rotate(0deg)
            translateX(122px)
            rotate(0deg);
    }

    to{
        transform:
            rotate(360deg)
            translateX(122px)
            rotate(-360deg);
    }

}

@keyframes orbit3{

    from{
        transform:
            rotate(0deg)
            translateX(165px)
            rotate(0deg);
    }

    to{
        transform:
            rotate(360deg)
            translateX(165px)
            rotate(-360deg);
    }

}

@keyframes orbit4{

    from{
        transform:
            rotate(0deg)
            translateX(212px)
            rotate(0deg);
    }

    to{
        transform:
            rotate(360deg)
            translateX(212px)
            rotate(-360deg);
    }

}

@keyframes orbit5{

    from{
        transform:
            rotate(0deg)
            translateX(262px)
            rotate(0deg);
    }

    to{
        transform:
            rotate(360deg)
            translateX(262px)
            rotate(-360deg);
    }

}

@keyframes orbit6{

    from{
        transform:
            rotate(0deg)
            translateX(312px)
            rotate(0deg);
    }

    to{
        transform:
            rotate(360deg)
            translateX(312px)
            rotate(-360deg);
    }

}


/* ================= NAVIGATION ================= */

nav{
    position:relative;

    z-index:10;

    display:flex;

    justify-content:center;

    gap:12px;

    padding:22px;
}

nav a{

    color:white;

    text-decoration:none;

    padding:
        9px 18px;

    border-radius:25px;

    background:
        rgba(0,70,120,.32);

    border:
        1px solid
        rgba(150,230,255,.25);

    backdrop-filter:blur(8px);

    transition:.3s;
}

nav a:hover{

    background:
        rgba(0,180,255,.28);

    box-shadow:
        0 0 20px
        #00d9ff;

    transform:
        translateY(-3px);
}


/* ================= MAIN ================= */

.main{

    min-height:
        calc(100vh - 75px);

    display:flex;

    align-items:center;

    padding-left:
        8%;

    padding-bottom:
        30px;

}


/* CONTENT LEFT */

.content{

    width:
        430px;

    text-align:center;

    position:relative;

    z-index:5;
}


/* PROFILE IMAGE */

.profile{

    width:190px;
    height:190px;

    object-fit:cover;

    border-radius:50%;

    border:
        4px solid
        rgba(130,235,255,.85);

    box-shadow:
        0 0 25px #00d9ff,
        0 0 65px rgba(0,200,255,.4);

    margin-bottom:20px;

    transition:.5s;
}

.profile:hover{

    transform:
        scale(1.05)
        rotate(2deg);

    box-shadow:
        0 0 35px #00eaff,
        0 0 85px rgba(0,210,255,.55);
}


/* NAME OUTSIDE CARD */

.name{

    margin-bottom:22px;

}

.name h1{

    font-size:42px;

    margin-bottom:7px;

    text-shadow:
        0 0 20px #00d9ff,
        0 0 45px rgba(0,180,255,.4);
}

.name p{

    color:#9deeff;

    font-size:17px;

    letter-spacing:1px;
}


/* CARD */

.intro-card{

    padding:
        28px 30px;

    background:
        rgba(0,25,60,.65);

    backdrop-filter:
        blur(12px);

    border:
        1px solid
        rgba(150,230,255,.3);

    border-radius:
        25px;

    box-shadow:
        0 20px 50px
        rgba(0,0,0,.4);

    transition:.4s;
}

.intro-card:hover{

    border-color:
        rgba(0,220,255,.55);

    box-shadow:
        0 20px 60px
        rgba(0,180,255,.18);

}


/* CARD TEXT */

.intro-card p{

    color:#dcefff;

    line-height:1.8;

    margin-bottom:20px;
}


/* BUTTON */

.more{

    display:inline-block;

    padding:
        14px 30px;

    color:white;

    text-decoration:none;

    font-size:16px;

    font-weight:bold;

    border-radius:30px;

    background:
        linear-gradient(
            90deg,
            #006cff,
            #00d9ff
        );

    box-shadow:
        0 0 25px
        rgba(0,210,255,.45);

    transition:.35s;
}

.more:hover{

    transform:
        translateY(-5px)
        scale(1.04);

    box-shadow:
        0 0 35px
        #00d9ff;
}


/* ================= MOBILE ================= */

@media(max-width:800px){

    body{
        overflow:auto;
    }

    nav{
        gap:7px;
        padding:15px 10px;
    }

    nav a{
        padding:8px 12px;
        font-size:13px;
    }

    .solar{

        width:480px;
        height:480px;

        right:-220px;

        top:55%;

        opacity:.65;
    }

    .main{

        justify-content:center;

        padding:
            35px 20px 60px;

    }

    .content{

        width:
            min(400px,95vw);

    }

    .profile{

        width:150px;
        height:150px;

    }

    .name h1{

        font-size:32px;

    }

    .intro-card{

        padding:24px 20px;

    }

}

</style>
</head>


<body>


<!-- BACKGROUND -->

<div class="space"></div>


<!-- SOLAR SYSTEM -->

<div class="solar">
