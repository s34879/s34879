<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Portfolio | ภัคจิรา นงนุช</title>

<style>

/* ================= RESET ================= */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial,"Noto Sans Thai",sans-serif;
    color:white;
    min-height:100vh;
    overflow:hidden;
}


/* ================= พื้นหลังอวกาศ ================= */

.space{
    position:fixed;
    inset:0;
    z-index:-20;

    background:
        radial-gradient(
            circle at 70% 45%,
            rgba(10,35,65,.35),
            transparent 35%
        ),
        radial-gradient(
            circle at 20% 70%,
            rgba(0,80,120,.18),
            transparent 30%
        ),
        #000000;
}


/* ================= ดาวเต็มท้องฟ้า ================= */

.space::after{
    content:"";
    position:absolute;
    inset:0;

    background-image:
        radial-gradient(
            circle,
            rgba(255,255,255,.95) 1px,
            transparent 1.5px
        ),
        radial-gradient(
            circle,
            rgba(150,230,255,.8) 1px,
            transparent 1.5px
        ),
        radial-gradient(
            circle,
            rgba(255,255,255,.7) 2px,
            transparent 2.5px
        );

    background-size:
        85px 85px,
        137px 137px,
        230px 230px;

    background-position:
        0 0,
        35px 60px,
        100px 20px;

    opacity:.8;
}


/* ================= เมนู ================= */

nav{
    position:relative;
    z-index:100;

    height:75px;

    display:flex;
    justify-content:center;
    align-items:center;

    gap:25px;

    background:rgba(0,8,30,.7);

    backdrop-filter:blur(12px);

    border-bottom:
        1px solid rgba(100,220,255,.3);
}

nav a{
    color:white;

    text-decoration:none;

    padding:10px 18px;

    border-radius:25px;

    font-size:16px;

    transition:.3s;
}

nav a:hover{
    background:
        rgba(0,200,255,.2);

    color:#7eeaff;

    box-shadow:
        0 0 18px rgba(0,200,255,.5);
}


/* ================= ระบบสุริยะ ================= */

.solar{
    position:fixed;

    width:700px;
    height:700px;

    right:-120px;
    top:55%;

    transform:translateY(-50%);

    z-index:1;

    pointer-events:none;
}


/* ================= ดวงอาทิตย์ ================= */

.sun{
    position:absolute;

    width:105px;
    height:105px;

    left:50%;
    top:50%;

    transform:
        translate(-50%,-50%);

    border-radius:50%;

    background:
        radial-gradient(
            circle,
            #ffffff 5%,
            #fff7a0 25%,
            #ffd21c 50%,
            #ff8500 75%,
            #ff4500 100%
        );

    box-shadow:
        0 0 30px #ffffff,
        0 0 65px #ffd21c,
        0 0 120px #ff9000,
        0 0 190px rgba(255,120,0,.5);

    animation:
        sunGlow 3s infinite alternate;
}


/* ดวงอาทิตย์กระพริบ */

@keyframes sunGlow{

    from{
        box-shadow:
            0 0 25px #ffffff,
            0 0 55px #ffd21c,
            0 0 100px #ff9000;
    }

    to{
        box-shadow:
            0 0 40px #ffffff,
            0 0 80px #ffd21c,
            0 0 150px #ff9000,
            0 0 210px rgba(255,100,0,.5);
    }

}


/* ================= วงโคจร ================= */

.orbit{
    position:absolute;

    left:50%;
    top:50%;

    border:
        1px solid rgba(100,220,255,.35);

    border-radius:50%;

    transform:
        translate(-50%,-50%)
        rotateX(65deg);
}

.o1{
    width:160px;
    height:160px;
}

.o2{
    width:240px;
    height:240px;
}

.o3{
    width:320px;
    height:320px;
}

.o4{
    width:410px;
    height:410px;
}

.o5{
    width:520px;
    height:520px;
}

.o6{
    width:630px;
    height:630px;
}


/* ================= ดาวเคราะห์ ================= */

.planet{
    position:absolute;

    left:50%;
    top:50%;

    border-radius:50%;
}


/* ดาวพุธ */

.p1{
    width:13px;
    height:13px;

    background:#aaa;

    animation:
        orbit1 5s linear infinite;
}


/* ดาวศุกร์ */

.p2{
    width:19px;
    height:19px;

    background:#d6a96c;

    box-shadow:
        0 0 10px #d6a96c;

    animation:
        orbit2 8s linear infinite;
}


/* โลก */

.p3{
    width:24px;
    height:24px;

    background:
        radial-gradient(
            circle at 30% 30%,
            #8df3ff,
            #087cff 55%,
            #063c9e
        );

    box-shadow:
        0 0 15px #00cfff;

    animation:
        orbit3 11s linear infinite;
}


/* ดาวอังคาร */

.p4{
    width:19px;
    height:19px;

    background:#d9533d;

    box-shadow:
        0 0 10px #e65b3c;

    animation:
        orbit4 15s linear infinite;
}


/* ดาวพฤหัส */

.p5{
    width:43px;
    height:43px;

    background:
        linear-gradient(
            #d8b58c,
            #8d684d,
            #d8c09b,
            #9b7455
        );

    animation:
        orbit5 20s linear infinite;
}


/* ดาวเสาร์ */

.p6{
    width:35px;
    height:35px;

    background:#d9bd7c;

    animation:
        orbit6 26s linear infinite;
}


/* วงแหวนดาวเสาร์ */

.p6::after{
    content:"";

    position:absolute;

    width:60px;
    height:15px;

    left:50%;
    top:50%;

    transform:
        translate(-50%,-50%)
        rotate(-15deg);

    border:
        3px solid rgba(230,210,160,.8);

    border-radius:50%;
}


/* ================= การหมุนดาว ================= */

@keyframes orbit1{

    from{
        transform:
            rotate(0deg)
            translateX(80px);
    }

    to{
        transform:
            rotate(360deg)
            translateX(80px);
    }

}


@keyframes orbit2{

    from{
        transform:
            rotate(60deg)
            translateX(120px);
    }

    to{
        transform:
            rotate(420deg)
            translateX(120px);
    }

}


@keyframes orbit3{

    from{
        transform:
            rotate(120deg)
            translateX(160px);
    }

    to{
        transform:
            rotate(480deg)
            translateX(160px);
    }

}


@keyframes orbit4{

    from{
        transform:
            rotate(180deg)
            translateX(205px);
    }

    to{
        transform:
            rotate(540deg)
            translateX(205px);
    }

}


@keyframes orbit5{

    from{
        transform:
            rotate(230deg)
            translateX(260px);
    }

    to{
        transform:
            rotate(590deg)
            translateX(260px);
    }

}


@keyframes orbit6{

    from{
        transform:
            rotate(300deg)
            translateX(315px);
    }

    to{
        transform:
            rotate(660deg)
            translateX(315px);
    }

}


/* ================= เนื้อหาหลัก ================= */

.main{
    position:relative;

    z-index:10;

    min-height:
        calc(100vh - 75px);

/* ================= แนะนำตัว ================= */

/* ================= ปุ่ม ================= */

.more{

    display:inline-block;

    background:

}


.more:hover{

    transform:
        scale(1.07);

    box-shadow:
        0 0 35px #00d9ff,
        0 0 60px rgba(0,190,255,.5);
