<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Portfolio - นางสาวภัคจิรา นงนุช</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial, "Noto Sans Thai", sans-serif;
    color:white;
    min-height:100vh;
    overflow:hidden;
}

/* ================= พื้นหลัง ================= */

.space{
    position:fixed;
    inset:0;
    z-index:-10;

    background:
    linear-gradient(
        rgba(0,5,25,0.25),
        rgba(0,10,40,0.35)
    ),
    url("space.jpg") center center / cover no-repeat;
}

/* ดาวเล็ก ๆ */

.space::after{
    content:"";
    position:absolute;
    inset:0;

    background-image:
        radial-gradient(white 1px, transparent 1px),
        radial-gradient(#8eeaff 1px, transparent 1px);

    background-size:
        90px 90px,
        145px 145px;

    opacity:.6;
}


/* ================= NAVBAR ================= */

nav{
    position:relative;
    z-index:100;

    height:75px;

    display:flex;
    justify-content:center;
    align-items:center;

    gap:35px;

    background:rgba(0,10,35,.65);
    backdrop-filter:blur(12px);

    border-bottom:1px solid rgba(120,220,255,.25);
}

nav a{
    color:white;
    text-decoration:none;

    font-size:16px;

    padding:10px 18px;

    border-radius:20px;

    transition:.3s;
}

nav a:hover{
    background:rgba(0,200,255,.2);
    color:#7eeaff;

    box-shadow:
        0 0 15px rgba(0,200,255,.5);
}


/* ================= ระบบสุริยะ ================= */

.solar{
    position:fixed;

    width:700px;
    height:700px;

    right:-50px;
    top:50%;

    transform:translateY(-50%);

    z-index:2;

    pointer-events:none;
}


/* ดวงอาทิตย์ */

.sun{
    position:absolute;

    width:110px;
    height:110px;

    left:50%;
    top:50%;

    transform:translate(-50%,-50%);

    border-radius:50%;

    background:
    radial-gradient(
        circle,
        #ffffff 5%,
        #fff6a0 25%,
        #ffd21c 50%,
        #ff8500 75%,
        #ff4500 100%
    );

    box-shadow:
        0 0 25px #fff,
        0 0 60px #ffd21c,
        0 0 110px #ff9d00,
        0 0 180px rgba(255,120,0,.6);

    animation:sunGlow 3s infinite alternate;
}

@keyframes sunGlow{

    from{
        box-shadow:
        0 0 25px #fff,
        0 0 60px #ffd21c,
        0 0 110px #ff9d00;
    }

    to{
        box-shadow:
        0 0 35px #fff,
        0 0 80px #ffd21c,
        0 0 140px #ff8500,
        0 0 200px rgba(255,100,0,.5);
    }

}


/* วงโคจร */

.orbit{
    position:absolute;

    left:50%;
    top:50%;

    border:1px solid rgba(100,220,255,.45);

    border-radius:50%;

    transform:
        translate(-50%,-50%)
        rotateX(65deg);

    box-shadow:
        0 0 8px rgba(0,200,255,.15);
}


/* ขนาดวงโคจร */

.o1{
    width:160px;
    height:160px;
}

.o2{
    width:240px;
    height:240px;
}

.o3{
    width:320px;
    height:320px;
}

.o4{
    width:410px;
    height:410px;
}

.o5{
    width:520px;
    height:520px;
}

.o6{
    width:630px;
    height:630px;
}


/* ================= ดาวเคราะห์ ================= */

.planet{
    position:absolute;

    left:50%;
    top:50%;

    border-radius:50%;

    transform-origin:center;

}


/* ดาวพุธ */

.p1{
    width:14px;
    height:14px;

    background:#aaa;

    animation:orbit1 5s linear infinite;
}


/* ดาวศุกร์ */

.p2{
    width:20px;
    height:20px;

    background:#e4b66b;

    box-shadow:0 0 10px #e4b66b;

    animation:orbit2 8s linear infinite;
}


/* โลก */

.p3{
    width:24px;
    height:24px;

    background:
    radial-gradient(
        circle at 30% 30%,
        #6ee7ff,
        #087cff 55%,
        #073b9e
    );

    box-shadow:
        0 0 15px #22cfff;

    animation:orbit3 11s linear infinite;
}


/* ดาวอังคาร */

.p4{
    width:19px;
    height:19px;

    background:#e65b3c;

    box-shadow:0 0 10px #e65b3c;

    animation:orbit4 15s linear infinite;
}


/* ดาวพฤหัส */

.p5{
    width:42px;
    height:42px;

    background:
    linear-gradient(
        #d9b58c,
        #8e6b4e,
        #d9c09b,
        #9b7354
    );

    animation:orbit5 20s linear infinite;
}


/* ดาวเสาร์ */

.p6{
    width:35px;
    height:35px;

    background:#d9bd7c;

    animation:orbit6 26s linear infinite;
}

.p6::after{
    content:"";

    position:absolute;

    width:58px;
    height:15px;

    left:50%;
    top:50%;

    transform:
        translate(-50%,-50%)
        rotate(-15deg);

    border:3px solid rgba(230,210,160,.8);

    border-radius:50%;
}


/* ================= Animation ================= */

@keyframes orbit1{

    from{
        transform:
        rotate(0deg)
        translateX(80px)
        rotate(0deg);
    }

    to{
        transform:
        rotate(360deg)
        translateX(80px)
        rotate(-360deg);
    }

}

@keyframes orbit2{

    from{
        transform:
        rotate(60deg)
        translateX(120px)
        rotate(-60deg);
    }

    to{
        transform:
        rotate(420deg)
        translateX(120px)
        rotate(-420deg);
    }

}

@keyframes orbit3{

    from{
        transform:
        rotate(120deg)
        translateX(160px)
        rotate(-120deg);
    }

    to{
        transform:
        rotate(480deg)
        translateX(160px)
        rotate(-480deg);
    }

}

@keyframes orbit4{

    from{
        transform:
        rotate(180deg)
        translateX(205px)
        rotate(-180deg);
    }

    to{
        transform:
        rotate(540deg)
        translateX(205px)
        rotate(-540deg);
    }

}

@keyframes orbit5{

    from{
        transform:
        rotate(230deg)
        translateX(260px)
        rotate(-230deg);
    }

    to{
        transform:
        rotate(590deg)
        translateX(260px)
        rotate(-590deg);
    }

}

@keyframes orbit6{

    from{
        transform:
        rotate(300deg)
        translateX(315px)
        rotate(-300deg);
    }

    to{
        transform:
        rotate(660deg)
        translateX(315px)
        rotate(-660deg);
    }

}


/* ================= หน้าแรก ================= */

.main{
    position:relative;

    z-index:20;

    min-height:calc(100vh - 75px);

    display:flex;

    align-items:center;

    padding-left:8%;
}


/* กล่องฝั่งซ้าย */

.content{
    width:460px;

    text-align:center;

    position:relative;

    z-index:30;
}


/* รูปโปรไฟล์ */

.profile{
    width:180px;
    height:180px;

    object-fit:cover;

    border-radius:50%;

    border:4px solid rgba(150,235,255,.9);

    box-shadow:
        0 0 20px rgba(0,220,255,.8),
        0 0 50px rgba(0,150,255,.4);

    margin-bottom:20px;
}


/* ชื่อ */

.name{
    margin-bottom:25px;
}

.name h1{
    font-size:40px;

    color:white;

    text-shadow:
        0 0 10px #00d9ff,
        0 0 25px rgba(0,200,255,.7);

    margin-bottom:8px;
}

.name p{
    color:#b9edff;

    font-size:17px;
}


/* การ์ด */

.intro-card{
    padding:28px 30px;

    background:
        rgba(0,25,60,.78);

    backdrop-filter:blur(15px);

    border:
        1px solid rgba(130,230,255,.45);

    border-radius:25px;

    box-shadow:
        0 0 25px rgba(0,150,255,.25),
        inset 0 0 20px rgba(0,150,255,.08);
}

.intro-card p{
    line-height:1.8;

    color:#e5faff;

    margin-bottom:22px;
}


/* ================= ปุ่ม ================= */

.more{
    display:inline-block;

    padding:14px 30px;

    border-radius:30px;

    background:
        linear-gradient(
            90deg,
            #006cff,
            #00d9ff
        );

    color:white;

    text-decoration:none;

    font-size:17px;

    font-weight:bold;

    box-shadow:
        0 0 15px rgba(0,200,255,.6);

    transition:.3s;
}

.more:hover{
    transform:scale(1.07);

    box-shadow:
        0 0 25px #00d9ff,
        0 0 50px rgba(0,180,255,.5);
}


/* ================= มือถือ ================= */

@media(max-width:850px){

    body{
        overflow:auto;
    }

    nav{
        gap:5px;

        height:auto;

        min-height:70px;

        flex-wrap:wrap;

        padding:10px;
    }

    nav a{
        font-size:13px;

        padding:7px 10px;
    }

    .solar{
        width:500px;
        height:500px;

        right:-260px;

        top:55%;

        opacity:.55;
    }

    .main{
        min-height:calc(100vh - 70px);

        padding:
            40px 20px;

        justify-content:center;
    }

    .content{
        width:100%;
        max-width:430px;
    }

    .profile{
        width:150px;
        height:150px;
    }

    .name h1{
        font-size:30px;
    }

}

</style>
</head>
