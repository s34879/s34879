<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Portfolio | ภัคจิรา นงนุช</title>

<style>

/* =========================
   RESET
========================= */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial, "Noto Sans Thai", sans-serif;
    color:white;
    min-height:100vh;
    overflow-x:hidden;
}


/* =========================
   พื้นหลังดวงดาวสีดำ
========================= */

.space{
    position:fixed;
    inset:0;
    z-index:-20;

    background:
        url("space.jpg") center/cover no-repeat;

    filter:brightness(0.35) contrast(1.15);
}

.space::after{
    content:"";
    position:absolute;
    inset:0;

    background-image:
        radial-gradient(
            white 1.3px,
            transparent 1.3px
        ),
        radial-gradient(
            #8eeaff 1px,
            transparent 1px
        );

    background-size:
        90px 90px,
        145px 145px;

    opacity:.65;
}


/* =========================
   เมนูด้านบน
========================= */

nav{
    position:relative;
    z-index:100;

    min-height:75px;

    display:flex;
    justify-content:center;
    align-items:center;

    gap:25px;

    padding:10px;

    background:rgba(0,5,20,.75);

    backdrop-filter:blur(12px);

    border-bottom:
        1px solid
        rgba(100,220,255,.3);
}

nav a{
    color:white;

    text-decoration:none;

    padding:10px 18px;

    border-radius:25px;

    font-size:16px;

    transition:.3s;
}

nav a:hover{
    background:
        rgba(0,190,255,.2);

    color:#7eeaff;

    box-shadow:
        0 0 18px
        rgba(0,200,255,.5);
}


/* =========================
   ระบบสุริยะ
========================= */

.solar{
    position:fixed;

    width:720px;
    height:720px;

    right:-100px;
    top:55%;

    transform:
        translateY(-50%);

    z-index:-2;

    pointer-events:none;
}


/* =========================
   ดวงอาทิตย์
========================= */

.sun{
    position:absolute;

    width:110px;
    height:110px;

    left:50%;
    top:50%;

    transform:
        translate(-50%,-50%);

    border-radius:50%;

    background:
        radial-gradient(
            circle,
            #ffffff 3%,
            #fff8a0 22%,
            #ffd21c 48%,
            #ff8c00 75%,
            #ff4500 100%
        );

    box-shadow:
        0 0 30px #ffffff,
        0 0 65px #ffd21c,
        0 0 120px #ff9d00,
        0 0 190px rgba(255,120,0,.55);

    animation:
        sunGlow
        3s
        ease-in-out
        infinite
        alternate;
}

@keyframes sunGlow{

    from{
        filter:brightness(1);
    }

    to{
        filter:brightness(1.2);
    }

}


/* =========================
   วงโคจร
========================= */

.orbit{
    position:absolute;

    left:50%;
    top:50%;

    border:
        1px solid
        rgba(90,205,255,.35);

    border-radius:50%;

    transform:
        translate(-50%,-50%)
        rotateX(65deg);
}

.o1{
    width:160px;
    height:160px;
}

.o2{
    width:240px;
    height:240px;
}

.o3{
    width:325px;
    height:325px;
}

.o4{
    width:420px;
    height:420px;
}

.o5{
    width:530px;
    height:530px;
}

.o6{
    width:640px;
    height:640px;
}


/* =========================
   ดาวเคราะห์
========================= */

.planet{
    position:absolute;

    left:50%;
    top:50%;

    border-radius:50%;
}


/* ดาวพุธ */

.p1{
    width:13px;
    height:13px;

    background:#aaa;

    animation:
        orbit1
        5s
        linear
        infinite;
}


/* ดาวศุกร์ */

.p2{
    width:19px;
    height:19px;

    background:#d6a96c;

    box-shadow:
        0 0 10px #d6a96c;

    animation:
        orbit2
        8s
        linear
        infinite;
}


/* โลก */

.p3{
    width:24px;
    height:24px;

    background:
        radial-gradient(
            circle at 30% 30%,
            #8df3ff,
            #087cff 55%,
            #063c9e
        );

    box-shadow:
        0 0 15px #00cfff;

    animation:
        orbit3
        11s
        linear
        infinite;
}


/* ดาวอังคาร */

.p4{
    width:19px;
    height:19px;

    background:#d9533d;

    box-shadow:
        0 0 10px #e65b3c;

    animation:
        orbit4
        15s
        linear
        infinite;
}


/* ดาวพฤหัส */

.p5{
    width:43px;
    height:43px;

    background:
        linear-gradient(
            #d8b58c,
            #8d684d,
            #d8c09b
        );

    animation:
        orbit5
        20s
        linear
        infinite;
}


/* ดาวเสาร์ */

.p6{
    width:35px;
    height:35px;

    background:#d9bd7c;

    animation:
        orbit6
        26s
        linear
        infinite;
}


/* วงแหวนดาวเสาร์ */

.p6::after{
    content:"";

    position:absolute;

    width:60px;
    height:15px;

    left:50%;
    top:50%;

    transform:
        translate(-50%,-50%)
        rotate(-15deg);

    border:
        3px solid
        rgba(230,210,160,.8);

    border-radius:50%;
}


/* =========================
   Animation ดาวเคราะห์
========================= */

@keyframes orbit1{

    from{
        transform:
            rotate(0deg)
            translateX(80px);
    }

    to{
        transform:
            rotate(360deg)
            translateX(80px);
    }

}

@keyframes orbit2{

    from{
        transform:
            rotate(60deg)
            translateX(120px);
    }

    to{
        transform:
            rotate(420deg)
            translateX(120px);
    }

}

@keyframes orbit3{

    from{
        transform:
            rotate(120deg)
            translateX(162px);
    }

    to{
        transform:
            rotate(480deg)
            translateX(162px);
    }

}

@keyframes orbit4{

    from{
        transform:
            rotate(180deg)
            translateX(210px);
    }

    to{
        transform:
            rotate(540deg)
            translateX(210px);
    }

}

@keyframes orbit5{

    from{
        transform:
            rotate(230deg)
            translateX(265px);
    }

    to{
        transform:
            rotate(590deg)
            translateX(265px);
    }

}

@keyframes orbit6{

    from{
        transform:
            rotate(300deg)
            translateX(320px);
    }

    to{
        transform:
            rotate(660deg)
            translateX(320px);
    }

}


/* =========================
   เนื้อหาหน้าแรก
========================= */

.main{
    position:relative;

    z-index:10;

    min-height:
        calc(100vh - 75px);

    display:flex;

    justify-content:center;

    align-items:center;

    padding:
        40px
        20px
        60px;
}

.content{
    width:700px;

    text-align:center;
}


/* =========================
   Welcome
========================= */

.welcome{
    font-size:40px;

    font-weight:900;

    color:#69e8ff;

    text-shadow:
        0 0 10px #00d9ff,
        0 0 25px rgba(0,200,255,.7);

    margin-bottom:25px;

    letter-spacing:1px;
}


/* =========================
   รูปโปรไฟล์
========================= */

.profile{
    width:150px;
    height:150px;

    object-fit:cover;

    border-radius:50%;

    border:
        4px solid
        #7cecff;

    box-shadow:
        0 0 20px
        rgba(0,210,255,.8),

        0 0 45px
        rgba(0,150,255,.45);

    margin-bottom:15px;
}


/* =========================
   ชื่อ
========================= */

.name{
    margin-bottom:20px;
}

.name h1{
    font-size:43px;

    color:white;

    text-shadow:
        0 0 10px #00d9ff,
        0 0 25px rgba(0,200,255,.7);

    margin-bottom:8px;
}

.name p{
    font-size:19px;

    color:#d9f8ff;
}


/* =========================
   การ์ดแนะนำตัว
========================= */

.intro-card{

    padding:
        30px
        35px;

    background:
        rgba(0,20,55,.86);

    backdrop-filter:blur(14px);

    border:
        1px solid
        rgba(100,220,255,.5);

    border-radius:30px;

    box-shadow:
        0 0 30px
        rgba(0,130,255,.25);
}


/* =========================
   แนะนำตัวสั้น ๆ
========================= */

.intro{

    font-size:19px;

    line-height:1.8;

    color:#effcff;

    margin-bottom:20px;
}


/* =========================
   เป้าหมาย
========================= */

.future{

    font-size:17px;

    line-height:1.8;

    color:#d9f8ff;

    margin-bottom:25px;
}

.future strong{

    color:#69eaff;
}


/* =========================
   ปุ่ม
========================= */

.more{

    display:inline-block;

    padding:
        14px
        35px;

    border-radius:35px;

    background:
        linear-gradient(
            90deg,
            #0077ff,
            #00d9ff
        );

    color:white;

    text-decoration:none;

    font-size:19px;

    font-weight:bold;

    box-shadow:
        0 0 20px
        rgba(0,210,255,.7);

    transition:.3s;
}

.more:hover{

    transform:scale(1.07);

    box-shadow:
        0 0 35px
        #00d9ff;
}


/* =========================
   มือถือ
========================= */

@media(max-width:800px){

    body{
        overflow:auto;
    }

    nav{
        gap:4px;
    }

    nav a{
        font-size:13px;

        padding:
            8px
            10px;
    }

    .main{
        padding-top:35px;
    }

    .welcome{
        font-size:29px;
    }

    .profile{
        width:125px;
        height:125px;
    }

    .name h1{
        font-size:32px;
    }

    .name p{
        font-size:17px;
    }

    .intro-card{
        padding:
            25px
            20px;
    }

    .intro{
        font-size:17px;
    }

    .future{
        font-size:15px;
    }

    .solar{

        width:520px;
        height:520px;

        right:-270px;

        top:55%;

        opacity:.5;
    }

}

</style>
</head>


<body>


<!-- =========================
     พื้นหลัง
========================= -->

<div class="space"></div>


<!-- =========================
     ระบบสุริยะ
========================= -->

<div class="solar">
