<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ภัคจิรา | My Portfolio</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}

body{
    font-family:Arial,"Noto Sans Thai",sans-serif;
    color:white;
    min-height:100vh;
    overflow-x:hidden;
    background:#020817;
}

/* BACKGROUND */
.space{
    position:fixed;
    inset:0;
    z-index:-20;
    background:
    linear-gradient(rgba(0,8,30,.25),rgba(0,10,35,.65)),
    url("space.jpg") center/cover no-repeat;
}

.space:after{
    content:"";
    position:absolute;
    inset:0;
    background-image:
    radial-gradient(#fff 1px,transparent 1px),
    radial-gradient(#8eeaff 1px,transparent 1px);
    background-size:95px 95px,145px 145px;
    opacity:.45;
}

/* SOLAR SYSTEM */
.solar{
    position:fixed;
    width:600px;
    height:600px;
    right:-110px;
    top:53%;
    transform:translateY(-50%) rotateX(15deg) rotateY(-10deg);
    perspective:1000px;
    z-index:-5;
}

.sun{
    position:absolute;
    width:90px;
    height:90px;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
    border-radius:50%;
    background:radial-gradient(circle,#fff,#fff29a 25%,#ffc21c 55%,#ff6800);
    box-shadow:
    0 0 25px #fff,
    0 0 65px #ffc21c,
    0 0 130px #ff6800;
    animation:sun 3s infinite alternate;
}

@keyframes sun{
    to{
        transform:translate(-50%,-50%) scale(1.08);
    }
}

.orbit{
    position:absolute;
    left:50%;
    top:50%;
    border:1px solid rgba(120,225,255,.28);
    border-radius:50%;
    transform:translate(-50%,-50%) rotateX(62deg);
}

.o1{width:145px;height:145px}
.o2{width:215px;height:215px}
.o3{width:295px;height:295px}
.o4{width:385px;height:385px}
.o5{width:480px;height:480px}
.o6{width:570px;height:570px}

.planet{
    position:absolute;
    left:50%;
    top:50%;
    border-radius:50%;
}

.p1{
    width:12px;height:12px;
    background:#aaa;
    box-shadow:0 0 10px #ddd;
    animation:a1 4s linear infinite;
}
.p2{
    width:18px;height:18px;
    background:#d99b50;
    box-shadow:0 0 12px #ffc778;
    animation:a2 7s linear infinite;
}
.p3{
    width:22px;height:22px;
    background:#2d91df;
    box-shadow:0 0 16px #36cfff;
    animation:a3 10s linear infinite;
}
.p4{
    width:17px;height:17px;
    background:#d75b4d;
    box-shadow:0 0 12px #ff7565;
    animation:a4 14s linear infinite;
}
.p5{
    width:40px;height:40px;
    background:#c99b62;
    box-shadow:0 0 15px #f4c98e;
    animation:a5 20s linear infinite;
}
.p6{
    width:34px;height:34px;
    background:#d5c48d;
    box-shadow:0 0 15px #fff0b0;
    animation:a6 27s linear infinite;
}

@keyframes a1{
    to{transform:rotate(360deg) translateX(72px) rotate(-360deg)}
}
@keyframes a2{
    to{transform:rotate(360deg) translateX(107px) rotate(-360deg)}
}
@keyframes a3{
    to{transform:rotate(360deg) translateX(147px) rotate(-360deg)}
}
@keyframes a4{
    to{transform:rotate(360deg) translateX(192px) rotate(-360deg)}
}
@keyframes a5{
    to{transform:rotate(360deg) translateX(240px) rotate(-360deg)}
}
@keyframes a6{
    to{transform:rotate(360deg) translateX(285px) rotate(-360deg)}
}

/* NAV */
nav{
    display:flex;
    justify-content:center;
    gap:12px;
    padding:22px;
    flex-wrap:wrap;
}

nav a{
    color:white;
    text-decoration:none;
    padding:10px 18px;
    border-radius:25px;
    background:rgba(0,80,130,.35);
    border:1px solid rgba(150,230,255,.25);
    transition:.3s;
}

nav a:hover{
    background:rgba(0,190,255,.3);
    box-shadow:0 0 20px #00d9ff;
    transform:translateY(-2px);
}

/* HOME */
.container{
    min-height:calc(100vh - 80px);
    display:flex;
    justify-content:center;
    align-items:center;
    padding:30px 20px 60px;
}

.home-card{
    width:min(950px,95%);
    padding:45px;
    display:flex;
    align-items:center;
    gap:45px;
    background:rgba(0,25,60,.72);
    backdrop-filter:blur(16px);
    border:1px solid rgba(150,230,255,.3);
    border-radius:32px;
    box-shadow:0 30px 80px rgba(0,0,0,.55);
}

.profile{
    width:220px;
    height:220px;
    flex-shrink:0;
    object-fit:cover;
    border-radius:50%;
    border:4px solid rgba(120,230,255,.8);
    box-shadow:
    0 0 25px #00cfff,
    0 0 60px rgba(0,180,255,.45);
}

.text h3{
    color:#7eeaff;
    letter-spacing:2px;
    margin-bottom:12px;
}

.text h1{
    font-size:46px;
    margin-bottom:12px;
    text-shadow:0 0 25px #00d9ff;
}

.text p{
    line-height:1.8;
    color:#dcefff;
}

.buttons{
    display:flex;
    flex-wrap:wrap;
    gap:12px;
    margin-top:25px;
}

.btn{
    display:inline-block;
    text-decoration:none;
    color:white;
    padding:13px 20px;
    border-radius:25px;
    background:linear-gradient(90deg,#006cff,#00cfff);
    box-shadow:0 0 20px rgba(0,210,255,.35);
    transition:.3s;
}

.btn:hover{
    transform:translateY(-5px) scale(1.03);
    box-shadow:0 0 30px #00d9ff;
}

@media(max-width:750px){
    .solar{
        right:-190px;
        opacity:.5;
    }

    .home-card{
        flex-direction:column;
        text-align:center;
        padding:35px 25px;
    }

    .profile{
        width:180px;
        height:180px;
    }

    .text h1{
        font-size:34px;
    }

    .buttons{
        justify-content:center;
    }
}
</style>
</head>

<body>

<div class="space"></div>

<div class="solar">
    <div class="orbit o1"></div>
    <div class="orbit o2"></div>
    <div class="orbit o3"></div>
    <div class="orbit o4"></div>
    <div class="orbit o5"></div>
    <div class="orbit o6"></div>

    <div class="sun"></div>

    <div class="planet p1"></div>
    <div class="planet p2"></div>
    <div class="planet p3"></div>
    <div class="planet p4"></div>
    <div class="planet p5"></div>
    <div class="planet p6"></div>
</div>

<nav>
    <a href="index.html">หน้าแรก</a>
    <a href="about.html">เกี่ยวกับฉัน</a>
    <a href="portfolio.html">ผลงาน</a>
    <a href="contact.html">ติดต่อ</a>
</nav>

<div class="container">

    <div class="home-card">

        <img src="profile.jpg" class="profile">

        <div class="text">

            <h3>WELCOME TO MY PORTFOLIO</h3>

            <h1>ภัคจิรา นงนุช</h1>

            <p>
                นักเรียนชั้นมัธยมศึกษาปีที่ 6
            </p>

            <p>
                ยินดีต้อนรับเข้าสู่เว็บไซต์แนะนำตัวของฉัน
                🌌✨
            </p>

            <div class="buttons">
                <a class="btn" href="about.html">
                    ✨ รู้จักฉัน
                </a>

                <a class="btn" href="portfolio.html">
                    🪐 ผลงาน
                </a>

                <a class="btn" href="contact.html">
                    💌 ติดต่อ
                </a>
            </div>

        </div>

    </div>

</div>

</body>
</html>
