<!DOCTYPE html>
<html lang="th">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>My Portfolio</title>

<style>

/* =========================
   พื้นฐาน
========================= */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,
body{
    width:100%;
    min-height:100%;
}

body{

    font-family:
        Arial,
        "Noto Sans Thai",
        sans-serif;

    color:white;

    background:#000713;

    overflow-x:hidden;
}


/* =========================
   พื้นหลัง
========================= */

.space{

    position:fixed;

    inset:0;

    width:100%;
    height:100%;

    background:
        linear-gradient(
            rgba(0,0,15,.25),
            rgba(0,5,25,.35)
        ),
        url("space.jpg")
        center/cover
        no-repeat;

    z-index:0;
}


/* ดาว */

.space::after{

    content:"";

    position:absolute;

    inset:0;

    background-image:

        radial-gradient(
            white 1.3px,
            transparent 1.3px
        ),

        radial-gradient(
            #b7efff 1px,
            transparent 1px
        );

    background-size:
        90px 90px,
        145px 145px;

    opacity:.75;
}


/* =========================
   ระบบสุริยะ
========================= */

.solar{

    position:fixed;

    width:650px;
    height:650px;

    right:-90px;
    top:58%;

    transform:
        translateY(-50%);

    z-index:1;

    pointer-events:none;

    opacity:.8;
}


/* ดวงอาทิตย์ */

.sun{

    position:absolute;

    width:100px;
    height:100px;

    left:50%;
    top:50%;

    transform:
        translate(-50%,-50%);

    border-radius:50%;

    background:

        radial-gradient(
            circle,

            #ffffff 3%,
            #fff7a0 20%,
            #ffd21c 48%,
            #ff8a00 75%,
            #ff4500 100%
        );

    box-shadow:

        0 0 25px #ffffff,
        0 0 60px #ffd21c,
        0 0 110px #ff8c00;

    animation:
        sunPulse
        3s
        ease-in-out
        infinite
        alternate;
}


@keyframes sunPulse{

    from{
        transform:
            translate(-50%,-50%)
            scale(1);
    }

    to{
        transform:
            translate(-50%,-50%)
            scale(1.08);
    }

}


/* วงโคจร */

.orbit{

    position:absolute;

    left:50%;
    top:50%;

    border:

        1px solid
        rgba(100,220,255,.35);

    border-radius:50%;

    transform:
        translate(-50%,-50%)
        rotateX(65deg);
}


.o1{
    width:140px;
    height:140px;
}

.o2{
    width:210px;
    height:210px;
}

.o3{
    width:280px;
    height:280px;
}

.o4{
    width:360px;
    height:360px;
}

.o5{
    width:460px;
    height:460px;
}

.o6{
    width:550px;
    height:550px;
}


/* ดาวเคราะห์ */

.planet{

    position:absolute;

    left:50%;
    top:50%;

    border-radius:50%;
}


/* พุธ */

.p1{

    width:11px;
    height:11px;

    background:#aaa;

    animation:
        orbit1
        5s
        linear
        infinite;
}


/* ศุกร์ */

.p2{

    width:17px;
    height:17px;

    background:#d8ae72;

    animation:
        orbit2
        8s
        linear
        infinite;
}


/* โลก */

.p3{

    width:21px;
    height:21px;

    background:#168cff;

    box-shadow:
        0 0 12px #00cfff;

    animation:
        orbit3
        11s
        linear
        infinite;
}


/* อังคาร */

.p4{

    width:17px;
    height:17px;

    background:#df543c;

    animation:
        orbit4
        15s
        linear
        infinite;
}


/* พฤหัส */

.p5{

    width:36px;
    height:36px;

    background:
        linear-gradient(
            #d9b88f,
            #8d694d,
            #d7bd99
        );

    animation:
        orbit5
        20s
        linear
        infinite;
}


/* เสาร์ */

.p6{

    width:30px;
    height:30px;

    background:#d7bc7c;

    animation:
        orbit6
        25s
        linear
        infinite;
}


.p6::after{

    content:"";

    position:absolute;

    width:53px;
    height:13px;

    left:50%;
    top:50%;

    transform:
        translate(-50%,-50%)
        rotate(-15deg);

    border:
        2px solid
        rgba(240,220,170,.8);

    border-radius:50%;
}


/* =========================
   การหมุน
========================= */

@keyframes orbit1{

    from{
        transform:
            rotate(0deg)
            translateX(70px);
    }

    to{
        transform:
            rotate(360deg)
            translateX(70px);
    }
}


@keyframes orbit2{

    from{
        transform:
            rotate(60deg)
            translateX(105px);
    }

    to{
        transform:
            rotate(420deg)
            translateX(105px);
    }
}


@keyframes orbit3{

    from{
        transform:
            rotate(120deg)
            translateX(140px);
    }

    to{
        transform:
            rotate(480deg)
            translateX(140px);
    }
}


@keyframes orbit4{

    from{
        transform:
            rotate(180deg)
            translateX(180px);
    }

    to{
        transform:
            rotate(540deg)
            translateX(180px);
    }
}


@keyframes orbit5{

    from{
        transform:
            rotate(230deg)
            translateX(230px);
    }

    to{
        transform:
            rotate(590deg)
            translateX(230px);
    }
}


@keyframes orbit6{

    from{
        transform:
            rotate(300deg)
            translateX(275px);
    }

    to{
        transform:
            rotate(660deg)
            translateX(275px);
    }
}


/* =========================
   NAVIGATION
========================= */

nav{

    position:relative;

    z-index:50;

    min-height:70px;

    display:flex;

    justify-content:center;

    align-items:center;

    gap:25px;

    padding:10px;

    background:
        rgba(0,5,20,.8);

    backdrop-filter:
        blur(10px);

    border-bottom:
        1px solid
        rgba(100,220,255,.3);
}


nav a{

    color:white;

    text-decoration:none;

    font-size:16px;

    padding:
        10px
        18px;

    border-radius:25px;

    transition:.3s;
}


nav a:hover{

    color:#73eaff;

    background:
        rgba(0,190,255,.2);

    box-shadow:
        0 0 15px
        rgba(0,210,255,.5);
}


/* =========================
   เนื้อหาหน้าแรก
========================= */

.main{

    position:relative;

    z-index:30;

    min-height:
        calc(100vh - 70px);

    display:flex;

    justify-content:center;

    align-items:center;

    padding:
        35px
        20px
        50px;
}


.content{

    width:680px;

    text-align:center;

    /* สำคัญมาก */
    position:relative;

    z-index:40;
}


/* =========================
   WELCOME
========================= */

.welcome{

    font-size:40px;

    font-weight:900;

    color:#6eeaff;

    text-shadow:

        0 0 10px #00d9ff,

        0 0 25px
        rgba(0,200,255,.7);

    margin-bottom:20px;
}


/* =========================
   รูป
========================= */

.profile{

    width:145px;
    height:145px;

    object-fit:cover;

    border-radius:50%;

    border:
        4px solid
        #7cecff;

    box-shadow:

        0 0 20px
        rgba(0,210,255,.8),

        0 0 45px
        rgba(0,150,255,.45);

    margin-bottom:15px;
}


/* =========================
   ชื่อ
========================= */

.name{

    margin-bottom:20px;
}


.name h1{

    font-size:43px;

    color:white;

    text-shadow:

        0 0 10px #00d9ff,

        0 0 25px
        rgba(0,200,255,.7);

    margin-bottom:7px;
}


.name p{

    font-size:19px;

    color:#d9f8ff;
}


/* =========================
   การ์ด
========================= */

.intro-card{

    position:relative;

    z-index:50;

    padding:
        28px
        35px;

    background:
        rgba(0,15,45,.92);

    backdrop-filter:
        blur(15px);

    border:
        1px solid
        rgba(100,220,255,.55);

    border-radius:28px;

    box-shadow:

        0 0 30px
        rgba(0,130,255,.35);
}


/* แนะนำตัว */

.intro{

    font-size:19px;

    line-height:1.8;

    color:#f0fcff;

    margin-bottom:18px;
}


/* เป้าหมาย */

.future{

    font-size:17px;

    line-height:1.8;

    color:#d9f8ff;

    margin-bottom:23px;
}


.future strong{

    color:#69eaff;
}


/* =========================
   ปุ่ม
========================= */

.more{

    display:inline-block;

    padding:
        14px
        35px;

    border-radius:35px;

    background:
        linear-gradient(
            90deg,
            #0077ff,
            #00d9ff
        );

    color:white;

    text-decoration:none;

    font-size:19px;

    font-weight:bold;

    box-shadow:
        0 0 20px
        rgba(0,210,255,.7);

    transition:.3s;
}


.more:hover{

    transform:scale(1.07);

    box-shadow:
        0 0 35px
        #00d9ff;
}


/* =========================
   มือถือ
========================= */

@media(max-width:800px){

    body{
        overflow:auto;
    }

    nav{

        gap:3px;

        flex-wrap:wrap;
    }

    nav a{

        font-size:13px;

        padding:
            8px
            10px;
    }

    .main{

        padding:
            30px
            15px
            50px;
    }

    .welcome{

        font-size:29px;
    }

    .profile{

        width:125px;
        height:125px;
    }

    .name h1{

        font-size:32px;
    }

    .name p{

        font-size:17px;
    }

    .intro-card{

        padding:
            25px
            20px;
    }

    .intro{

        font-size:17px;
    }

    .future{

        font-size:15px;
    }

    .solar{

        width:500px;
        height:500px;

        right:-260px;

        top:58%;

        opacity:.45;
    }

}

</style>

</head>


<body>

     พื้นหลัง
========================= -->
