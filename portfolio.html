<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ผลงาน | Portfolio</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;}

body{
    font-family:Arial,"Noto Sans Thai",sans-serif;
    color:white;
    min-height:100vh;
    overflow:hidden;
}

.space{
    position:fixed;
    inset:0;
    z-index:-20;
    background:
        linear-gradient(rgba(0,0,0,.15),rgba(0,0,0,.15)),
        url("space.jpg") center/cover no-repeat;
}

.space::after{
    content:"";
    position:absolute;
    inset:0;
    background-image:
        radial-gradient(white 1px,transparent 1.5px),
        radial-gradient(#8eeaff 1px,transparent 1.5px);
    background-size:100px 100px,160px 160px;
    opacity:.35;
}

nav{
    position:relative;
    z-index:100;
    min-height:75px;
    display:flex;
    justify-content:center;
    align-items:center;
    gap:20px;
    background:rgba(0,5,20,.65);
    backdrop-filter:blur(12px);
    border-bottom:1px solid rgba(100,220,255,.3);
}

nav a{
    color:white;
    text-decoration:none;
    padding:10px 18px;
    border-radius:25px;
}

nav a:hover{
    background:rgba(0,200,255,.2);
    color:#7eeaff;
}

.main{
    min-height:calc(100vh - 75px);
    display:flex;
    justify-content:center;
    align-items:center;
    padding:25px;
}

.card{
    width:900px;
    padding:35px;

    text-align:center;

    background:rgba(0,20,55,.84);
    backdrop-filter:blur(14px);

    border:1px solid rgba(100,220,255,.45);
    border-radius:30px;

    box-shadow:0 0 35px rgba(0,150,255,.3);
}

.card h1{
    color:#69e8ff;
    font-size:40px;
    text-shadow:0 0 15px #00d9ff;
    margin-bottom:25px;
}

.works{
    display:flex;
    justify-content:center;
    gap:20px;
}

.work{
    width:30%;
    background:rgba(0,70,120,.3);
    border:1px solid rgba(100,220,255,.25);
    border-radius:20px;
    overflow:hidden;
}

.work img{
    width:100%;
    height:170px;
    object-fit:cover;
}

.work h3{
    color:#69e8ff;
    margin:12px 8px 6px;
}

.work p{
    color:#d9f8ff;
    font-size:14px;
    padding:0 12px 18px;
    line-height:1.6;
}

.next{
    display:inline-block;
    margin-top:25px;
    padding:13px 30px;
    background:linear-gradient(90deg,#0077ff,#00d9ff);
    color:white;
    text-decoration:none;
    border-radius:30px;
    font-weight:bold;
    box-shadow:0 0 20px rgba(0,210,255,.6);
}

@media(max-width:800px){
    body{overflow:auto;}

    .works{
        flex-direction:column;
    }

    .work{
        width:100%;
    }

    .card{
        width:100%;
    }

    nav{
        flex-wrap:wrap;
    }
}
</style>
</head>

<body>

<div class="space"></div>

<nav>
    <a href="index.html">🏠 หน้าแรก</a>
    <a href="about.html">👩🏻‍💻 เกี่ยวกับฉัน</a>
    <a href="portfolio.html">💼 ผลงาน</a>
    <a href="contact.html">📱 ติดต่อ</a>
</nav>

<div class="main">

    <div class="card">

        <h1>💼 MY PORTFOLIO</h1>

        <div class="works">

            <div class="work">
                <img src="work1.jpg" alt="ผลงานที่ 1">
                <h3>ผลงานที่ 1</h3>
                <p>
                    ผลงานและกิจกรรมที่ได้ทำ
                    ระหว่างการเรียน
                </p>
            </div>

            <div class="work">
                <img src="work2.jpg" alt="ผลงานที่ 2">
                <h3>ผลงานที่ 2</h3>
                <p>
                    กิจกรรมที่ได้ฝึกการทำงาน
                    และการทำงานร่วมกับผู้อื่น
                </p>
            </div>

            <div class="work">
                <img src="work3.jpg" alt="ผลงานที่ 3">
                <h3>ผลงานที่ 3</h3>
                <p>
                    ผลงานที่แสดงถึงความคิดสร้างสรรค์
                    และความสามารถของฉัน
                </p>
            </div>

        </div>

        <a href="contact.html" class="next">
            ➡️ ติดต่อฉัน
        </a>

    </div>

</div>

</body>
</html>
